<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACCESO CON UN CLICK - TIERRA ROSA</title>
<style>
:root{--beige:#F5E8D0;--beige2:#FFF8EC;--borde:#D9C5A0}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--beige);color:#000}
.wrap{max-width:520px;margin:auto;padding:12px}
.top{text-align:center;padding:16px 0}
.icon{width:84px;height:84px;border-radius:50%;background:#fff;border:3px solid var(--borde);display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto}
h1{font-size:20px;font-weight:900;margin-top:10px;letter-spacing:1px}
.card{background:var(--beige2);border:3px solid var(--borde);border-radius:14px;padding:12px;margin:12px 0}
.lab{display:block;font-size:12px;font-weight:900;margin:6px 0 4px}
.inp{width:100%;padding:11px;border:2px solid var(--borde);border-radius:9px;background:#fff;color:#000;font-size:12px}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.btn{background:#fff;color:#000;border:2px solid #000;border-radius:8px;padding:9px;font-weight:900;font-size:10px;cursor:pointer}
.btn:active{transform:scale(.96);background:#000;color:#fff}
.btn-ok{background:#000;color:#fff}
.foot{text-align:center;margin:18px 0}
.btnInicio{width:100%;max-width:200px;padding:12px;background:#fff;color:#000;border:2px solid #000;border-radius:10px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="icon">🌸</div>
<h1>ACCESO CON UN CLICK</h1>
</div>

<div id="lista"></div>

<div class="foot"><button class="btnInicio" onclick="location.href='index.html'">[Inicio]</button></div>
</div>

<script>
const apps=["Google","GitHub","Vercel","Netlify","Render","Claro","Word","Files","Copa Fácil","Spotify","Facebook","Steam","Bluesky","XBOX","Apple TV","LinkedIn","Tik Tok","Canva","Pinterest","Threads","Duolingo","Termux","YouTube","EA","Acode","Twitch","Instagram","Snapchat","Telegram","Titanes","Speaking","FreeFire","Amazon","FC Mobile"];

function crear(){
let cont=document.getElementById('lista');
apps.forEach(name=>{
let id=name.replace(/\s/g,'_');
let guardado=localStorage.getItem('link_'+id)||'';
cont.innerHTML+=`
<div class="card">
<span class="lab">añadir enlace de ${name}</span>
<input id="inp_${id}" class="inp" placeholder="https://${name.toLowerCase().replace(/ /g,'')}.com tu enlace" value="${guardado}">
<div class="btns">
<button class="btn" onclick="guardar('${id}','${name}')">Guardar</button>
<button class="btn" onclick="login('${id}','${name}')">Login</button>
<button class="btn" onclick="autorizar('${id}','${name}')">Autorizar</button>
</div>
<span id="msg_${id}" style="font-size:10px;font-weight:800;color:#000;display:block;margin-top:6px"></span>
</div>`;
});
}

function guardar(id,name){
let val=document.getElementById('inp_'+id).value.trim();
if(!val){alert('Escribe el enlace de '+name);return}
localStorage.setItem('link_'+id,val);
localStorage.setItem('auth_'+id,'no');
document.getElementById('msg_'+id).innerText='✓ Guardado: '+val;
alert(name+' Guardado ✅');
}
function login(id,name){
let val=document.getElementById('inp_'+id).value.trim() || localStorage.getItem('link_'+id);
if(!val){alert('Primero guarda el enlace de '+name);return}
localStorage.setItem('ultimo_login',name);
document.getElementById('msg_'+id).innerText='→ Login a '+name;
location.href='tienda.html?login='+id;
}
function autorizar(id,name){
let val=localStorage.getItem('link_'+id);
if(!val){alert('Primero guarda el enlace de '+name);return}
localStorage.setItem('auth_'+id,'si');
document.getElementById('msg_'+id).innerText='✓ Autorizado '+name;
alert(name+' Autorizado ✅ Ahora puedes hacer Login');
}

crear();
</script>
</body>
</html>
