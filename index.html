<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIERRA ROSA - 15K Productos</title>
<style>
:root{--beige:#F5EDE0;--arena:#E8DCC8;--crema:#C9B99A;--cafe:#5C3D2E;}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
body{background:var(--beige);color:var(--cafe);}
.hidden{display:none!important;}
.btn{background:white;border:2.5px solid var(--crema);padding:12px;border-radius:12px;font-weight:800;width:100%;cursor:pointer;}
.btn:hover{background:var(--cafe);color:white;}
.input{width:100%;padding:12px;border:2px solid var(--crema);border-radius:11px;margin:5px 0;background:white;}
#appHeader{position:sticky;top:0;z-index:50;background:#FFFEFB;border-bottom:2px solid var(--arena);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;}
.icon{font-size:22px;padding:8px 12px;background:var(--beige);border:2px solid var(--crema);border-radius:10px;cursor:pointer;}
.circle{width:46px;height:46px;border-radius:50%;background:var(--beige);border:2.5px solid var(--crema);display:flex;align-items:center;justify-content:center;font-size:26px;}
#sidebar{position:fixed;top:0;left:-300px;width:285px;height:100vh;background:white;z-index:100;transition:.3s;padding:20px;}#sidebar.open{left:0;}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:none;}#overlay.show{display:block;}
.searchBig{width:100%;padding:20px 20px 20px 55px;border-radius:18px;border:2.5px solid var(--cafe);font-size:17px;background:white;box-shadow:0 8px 25px rgba(92,61,46,.15);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}@media(min-width:900px){.grid{grid-template-columns:1fr 1fr 1fr 1fr;}}
.prod{background:white;border-radius:18px;overflow:hidden;border:2px solid var(--arena);box-shadow:0 8px 20px rgba(92,61,46,.12);position:relative;}
.badge{position:absolute;top:8px;left:8px;background:var(--cafe);color:white;font-size:9px;padding:4px 8px;border-radius:20px;}
.disc{position:absolute;top:8px;right:8px;background:#D96C6C;color:white;font-size:10px;padding:4px 8px;border-radius:20px;}
.draw{height:170px;background:linear-gradient(135deg,#F5EDE0,#E8DCC8,#C9B99A);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.price{width:100%;background:white;border:2px solid var(--cafe);border-radius:10px;padding:8px;font-weight:900;font-size:12px;pointer-events:none;margin-top:6px;}
</style>
</head>
<body>
<header id="appHeader">
<div style="display:flex;align-items:center;gap:10px;"><div class="icon" onclick="toggle()">☰</div><div style="display:flex;align-items:center;gap:10px;"><div class="circle">🌸</div><div><h2 style="font-size:14px;letter-spacing:2px;">TIERRA ROSA</h2><span style="font-size:10px;opacity:.7;">BELLEZA QUE NACE DE LA TIERRA</span></div></div></div>
<div style="display:flex;align-items:center;gap:8px;">🛒<span id="cart" style="background:var(--cafe);color:white;border-radius:50%;padding:2px 7px;font-size:11px;">0</span><img id="pimg" src="https://i.pravatar.cc/100" style="width:42px;height:42px;border-radius:50%;border:2px solid var(--crema);"><div style="display:flex;flex-direction:column;gap:4px;"><button class="btn" style="padding:5px 8px;font-size:10px;" onclick="document.getElementById('fp').click()">👤 Subir Foto</button><button class="btn" style="padding:5px 8px;font-size:10px;background:var(--cafe);color:white;" onclick="alert('Botón Guardar Foto OK')">Guardar Foto</button></div><input type="file" id="fp" hidden accept="image/*" onchange="up(event)"></div>
</header>
<div id="overlay" onclick="toggle()"></div>
<nav id="sidebar"><div style="display:flex;align-items:center;gap:10px;"><div class="circle">🌸</div><div><h2 style="font-size:14px;">TIERRA ROSA</h2><span style="font-size:10px;">BELLEZA QUE NACE DE LA TIERRA</span></div></div><br><a href="#" onclick="showTienda();toggle();return false;" style="display:block;padding:12px;background:var(--beige);border-radius:12px;text-decoration:none;color:var(--cafe);font-weight:700;">🛍️ Tienda 15,000</a><br><a href="acerca-de.html" style="display:block;padding:12px;background:var(--cafe);color:white;border-radius:12px;text-decoration:none;">📖 Acerca de - Funciona</a><br><button class="btn" onclick="location.href='Login.html'">Ir a Login.html</button></nav>

<main style="padding:12px;max-width:1300px;margin:auto;">
<div style="background:white;border-radius:16px;padding:16px;border:1.5px solid var(--arena);">
<div style="display:flex;justify-content:space-between;"><h3>👤 Botón Editar Perfil</h3><button class="btn" style="width:auto;" onclick="document.getElementById('ea').classList.toggle('hidden')">Editar Perfil</button></div>
<div id="ea"><br>Descripción de Perdí<textarea class="input" style="height:80px;" placeholder="Descripción de Perdí"></textarea><button class="btn" onclick="alert('Descripción guardada')">Botón Guardar Descripción</button><br><br>
Agregar<br><br>6 Links Webs<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"><input class="input" placeholder="Web 1"><input class="input" placeholder="Web 2"><input class="input" placeholder="Web 3"><input class="input" placeholder="Web 4"><input class="input" placeholder="Web 5"><input class="input" placeholder="Web 6"></div><button class="btn" onclick="alert('Webs guardados')">Botón Guardar</button><br><br>
6 Links R. Sociales<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"><input class="input" placeholder="R.S 1"><input class="input" placeholder="2"><input class="input" placeholder="3"><input class="input" placeholder="4"><input class="input" placeholder="5"><input class="input" placeholder="6"></div><button class="btn" onclick="alert('Sociales guardados')">Botón Guardar</button><br><br>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;"><div>Ocupación<input class="input" placeholder="Ocupación"></div><div>E-mail<input class="input" placeholder="E-mail"></div><div>Teléfono<input class="input" placeholder="Teléfono"></div></div><button class="btn" onclick="alert('Contacto guardado')">Botón Guardar</button>
<br><br><button class="btn" style="background:var(--cafe);color:white;padding:16px;" onclick="alert('Botón [Guardar] todos los datos OK TITAN')">Botón [Guardar] todos los datos</button></div>
</div>

<div style="position:relative;margin:16px 0;"><span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;">🔍</span><input id="search" class="searchBig" placeholder="Buscador grande justo debajo de la Marca - busca entre 15,000" oninput="buscar()"></div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><b id="info">Cargando 15,000...</b><button class="btn" style="width:auto;" onclick="loadMore()">Cargar +100</button></div>
<div class="grid" id="grid"></div>
<div style="text-align:center;margin:20px;"><button class="btn" style="background:var(--cafe);color:white;padding:16px;" onclick="loadMore()">Ver más 100 productos (15,000 totales)</button><p style="font-size:11px;opacity:.6;margin-top:8px;" id="contador"></p></div>
</main>

<script>
const bases=[
{name:"Labial Natural Betabel Maquillaje",emoji:"💄",logo:"TR-LAB"},
{name:"Rubor Bambú 2 EN 1 Belleza",emoji:"🌸",logo:"TR-RUB"},
{name:"Sérum Pestañas Aguacate Cosmética",emoji:"🥑",logo:"TR-SER"},
{name:"Base Líquida Bambú Maquillaje",emoji:"🧴",logo:"TR-BAS"},
{name:"Polvo Compacto 3D",emoji:"✨",logo:"TR-POL"},
{name:"Iluminador Dorado",emoji:"💫",logo:"TR-ILU"},
{name:"Bronzer Bambú",emoji:"☀️",logo:"TR-BRO"},
{name:"Delineador Preciso",emoji:"✒️",logo:"TR-DEL"},
{name:"Gloss Jugoso",emoji:"💋",logo:"TR-GLO"},
{name:"Crema Hidratante 24H",emoji:"🧼",logo:"TR-CRE"},
{name:"Tónico Facial",emoji:"🌿",logo:"TR-TON"},
{name:"Aceite Argán",emoji:"💧",logo:"TR-ACE"},
{name:"Corrector Ojeras",emoji:"🎨",logo:"TR-COR"},
{name:"Contorno Barra",emoji:"🖌️",logo:"TR-CON"},
{name:"Rubor Líquido",emoji:"🌷",logo:"TR-RLI"}
];
let all=[];let filtered=[];let shown=0;const STEP=100;
function gen(){
for(let i=0;i<15000;i++){
let b=bases[i%bases.length];
let num=String(i+1).padStart(5,'0');
all.push({id:i+1,name:`${b.name} ${num}`,emoji:b.emoji,logo:`${b.logo}-${num}`,price:95+(i%300),discount:10+(i%31)});
}
filtered=[...all];
}
function renderChunk(){
const g=document.getElementById('grid');
let end=Math.min(shown+STEP,filtered.length);
for(let i=shown;i<end;i++){
let p=filtered[i];let final=Math.round(p.price*(1-p.discount/100));
g.innerHTML+=`<div class="prod"><span class="badge">Nuevo Lanzamiento</span><span class="disc">-${p.discount}%</span>
<div class="draw"><div style="font-size:48px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));">${p.emoji}</div><div style="background:white;border:2px solid #C9B99A;padding:3px 10px;border-radius:20px;font-weight:900;font-size:10px;margin-top:6px;letter-spacing:1px;">${p.logo}</div><div style="font-size:9px;opacity:.6;margin-top:3px;">Dibujo 3D Profesional</div></div>
<div style="padding:10px;"><b style="font-size:12px;">${p.name}</b><br><span style="font-size:10px;opacity:.7;">Logo ${p.logo} Nuevo Lanzamiento ${p.discount}%</span><button class="price">$${final} MXN <s style="opacity:.4;">$${p.price}</s> -${p.discount}% OFF</button></div></div>`;
}
shown=end;
document.getElementById('info').innerText=`Mostrando ${shown} de ${filtered.length} / 15,000 Maquillaje Belleza Cosmética`;
document.getElementById('contador').innerText=`Has visto ${shown} - Quedan ${filtered.length-shown}`;
}
function loadMore(){renderChunk();}
function buscar(){let q=document.getElementById('search').value.toLowerCase();filtered=all.filter(p=>p.name.toLowerCase().includes(q));document.getElementById('grid').innerHTML='';shown=0;renderChunk();}
function toggle(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');if(localStorage.getItem('tr_openMenu')){localStorage.removeItem('tr_openMenu');}}
function showTienda(){}
function up(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{document.getElementById('pimg').src=ev.target.result;};r.readAsDataURL(f);}
gen();renderChunk();
if(localStorage.getItem('tr_openMenu')){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show');}
</script>
</body>
                                                                                                                                                                                                                                                                  </html>
