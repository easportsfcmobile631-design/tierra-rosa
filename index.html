<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TierraRosa</title>
<link rel="icon" href="./icon-19.jpg">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F5E8D0">
<style>
:root{--beige:#F5E8D0;--crema:#FFF8EC;--blanco:#fff;--negro:#000}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black,Arial,sans-serif}
body{background:var(--beige);color:var(--negro)}
.top{background:var(--crema);border-bottom:3px solid #000;display:flex;align-items:center;gap:10px;padding:10px;position:sticky;top:0;z-index:10}
.cir{width:48px;height:48px;border:3px solid #000;border-radius:50%;overflow:hidden;background:#fff}
.cir img{width:100%;height:100%;object-fit:cover;display:block}
.brand{font-weight:900;font-size:16px}
.inst{margin-left:auto;border:3px solid #000;background:var(--blanco);border-radius:22px;padding:7px 15px;font-size:10px;font-weight:900;cursor:pointer}
.inst.on{background:#000;color:#fff}
.wrap{max-width:500px;margin:auto;padding:12px}
.card{background:var(--crema);border:3px solid #000;border-radius:14px;padding:12px;margin-bottom:12px}
.tit{border:3px solid #000;background:var(--blanco);border-radius:10px;text-align:center;padding:8px;font-size:12px;font-weight:900;margin-bottom:10px}
.inp{width:100%;border:2.5px solid #000;background:var(--blanco);border-radius:10px;padding:12px;margin:5px 0;font-size:12px;font-weight:700;outline:none}
.btn{width:100%;border:3px solid #000;background:var(--blanco);border-radius:10px;padding:12px;margin-top:6px;font-weight:900;cursor:pointer}
.btnN{background:#000;color:#fff}
.enlace{width:100%;border:0;border-bottom:2.5px solid #000;background:transparent;padding:14px 4px;font-weight:900;font-size:12px;display:flex;justify-content:space-between;cursor:pointer;text-align:left}
.enlace:active{background:#fff}
.bigGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigBtn{border:3px solid #000;background:var(--blanco);border-radius:10px;padding:15px 6px;font-size:11px;font-weight:900;cursor:pointer}
.bigBtn:active{background:#000;color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99;padding:15px}
#box{background:var(--crema);border:3px solid #000;border-radius:14px;padding:14px;width:100%;max-width:380px}
</style>
</head>
<body>
<div class="top">
<div class="cir"><img src="./icon-19.jpg"></div>
<div class="brand">TierraRosa</div>
<button class="inst" id="btnInstall">INSTALAR</button>
</div>

<div class="wrap">
<div class="card">
<div class="tit">INICIAR SESIÓN</div>
<input class="inp" placeholder="Usuario"><input class="inp" type="password" placeholder="Contraseña"><button class="btn btnN" onclick="go()">Login</button>
<input class="inp" placeholder="Teléfono" style="margin-top:10px"><input class="inp" type="password" placeholder="Contraseña"><button class="btn" onclick="go()">Login</button>
<input class="inp" placeholder="1er Correo Electrónico" style="margin-top:10px"><input class="inp" type="password" placeholder="Contraseña"><button class="btn" onclick="go()">Login</button>
<input class="inp" placeholder="2do Correo Electrónico" style="margin-top:10px"><input class="inp" type="password" placeholder="Contraseña"><button class="btn" onclick="go()">Login</button>
<input class="inp" placeholder="Microsoft" style="margin-top:10px"><input class="inp" type="password" placeholder="Contraseña"><button class="btn" onclick="go()">Login</button>
<input class="inp" placeholder="Drive" style="margin-top:10px"><input class="inp" type="password" placeholder="Contraseña"><button class="btn" onclick="go()">Login</button>
<input class="inp" placeholder="Netacad" style="margin-top:10px"><input class="inp" type="password" placeholder="Contraseña"><button class="btn" onclick="go()">Login</button>
<input class="inp" placeholder="Outlook" style="margin-top:10px"><input class="inp" type="password" placeholder="Contraseña"><button class="btn" onclick="go()">Login</button>
<input class="inp" placeholder="Eduardo" style="margin-top:10px"><input class="inp" type="password" placeholder="Contraseña"><button class="btn" onclick="go()">Login</button>
</div>

<div class="card">
<div class="tit">Enlaces click</div>
<button class="enlace" onclick="openM('Necesitas Ayuda')">Necesitas Ayuda <span>></span></button>
<button class="enlace" onclick="openM('Noticias')">Noticias <span>></span></button>
<button class="enlace" onclick="openM('Eventos')">Eventos <span>></span></button>
<button class="enlace" onclick="openM('Sociedad')">Sociedad <span>></span></button>
<button class="enlace" onclick="openM('Actualizaciones')">Actualizaciones <span>></span></button>
<button class="enlace" onclick="openM('Fundadores')">Fundadores <span>></span></button>
<button class="enlace" onclick="go()">Registrarme <span>></span></button>
<button class="enlace" onclick="go()">Un Click <span>></span></button>
<div style="text-align:center;font-weight:900;margin:12px 0">O</div>
<button class="btn btnN" onclick="go()">UN CLICK 👌</button>
</div>

<div class="card">
<div class="tit">Botones Grandes funcionando</div>
<div class="bigGrid" id="grid"></div>
</div>
</div>

<div id="modal" onclick="this.style.display='none'"><div id="box" onclick="event.stopPropagation()"><b id="mt"></b><div id="mx" style="font-size:11px;margin-top:8px;white-space:pre-line"></div><button class="btn btnN" style="margin-top:10px" onclick="document.getElementById('modal').style.display='none'">Cerrar</button></div></div>

<script>
let deferredPrompt;const bI=document.getElementById('btnInstall');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;bI.textContent='INSTALAR 📲';bI.classList.add('on')});
bI.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();const c=await deferredPrompt.userChoice;if(c.outcome==='accepted')bI.textContent='INSTALADO ✅';deferredPrompt=null}else{alert('TierraRosa 🌸\n\nPara instalar:\nChrome > 3 puntos > Instalar app')}});
function openM(t){document.getElementById('mt').innerText=t;document.getElementById('mx').innerText=t+'\n\nTierraRosa\nBeige Claro arena cálido / crema tostado\nTexto y bordes negro\nBotones blancos\n\nBotón funcionando ✅';document.getElementById('modal').style.display='flex'}
function go(){location.href='./tienda.html'}
const apps="Google,GitHub,Vercel,Netlify,Render,Claro,Word,Files,Copa Fácil,Spotify,Facebook,Steam,Bluesky,XBOX,Apple TV,LinkedIn,Tik Tok,Canva,Pinterest,Threads,Duolingo,Termux,YouTube,EA,Acode,Twitch,Instagram,Snapchat,Telegram,Titanes,Speaking,FreeFire,Amazon,FCMobile,Discord,Vix,Vivo".split(",");
const grid=document.getElementById('grid');
apps.forEach(n=>{let b=document.createElement('button');b.className='bigBtn';b.textContent=n;b.onclick=()=>openM(n);grid.appendChild(b)});
</script>
</body>
                                                                            </html>
