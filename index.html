<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TIERRA ROSA</title>
<div class="cir"><img src="./icon-19.jpg" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.src='icon-19-512.png'"></div>  
<link rel="apple-touch-icon" href="icon-19.jpg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EADFC7">
<style>
:root{--beige:#F5E8D0;--arena:#EADFC7;--crema:#FFF8EC;--negro:#000;--blanco:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black,Arial,sans-serif}
body{background:var(--beige);color:#000}
.top{background:var(--crema);border-bottom:3px solid #000;display:flex;align-items:center;gap:10px;padding:10px;position:sticky;top:0;z-index:9}
.cir{width:48px;height:48px;border:3px solid #000;border-radius:50%;background:var(--blanco);overflow:hidden}
.cir img{width:100%;height:100%;object-fit:cover}
.brand{font-size:14px;line-height:1;font-weight:900}
.wrap{max-width:460px;margin:auto;padding:10px}
.card{background:var(--crema);border:3px solid #000;border-radius:14px;padding:10px;margin-bottom:10px}
.head{border:2.5px solid #000;background:var(--blanco);border-radius:9px;text-align:center;padding:7px;font-size:11px;font-weight:900;margin-bottom:10px}
.inp{width:100%;border:2.5px solid #000;border-radius:9px;background:var(--blanco);padding:10px;font-size:11px;font-weight:700;margin:4px 0;outline:none;color:#000}
.btn{width:100%;border:2.5px solid #000;border-radius:9px;background:var(--blanco);padding:10px;font-size:11px;font-weight:900;color:#000;cursor:pointer;margin-top:4px}
.btnNegro{background:#000;color:#fff}
.btn:active{transform:scale(.98)}
.sep{text-align:center;font-size:10px;font-weight:900;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid #000;background:var(--blanco);border-radius:20px;padding:5px 10px;font-size:8px;font-weight:900}
</style>
</head>
<body>
<div class="top">
<div class="cir"><img src="icon-19.jpg"></div>
<div class="brand">TIERRA ROSA<br><span style="font-size:8px">x TITANES x SPEAKING</span></div>
<button class="chip" style="margin-left:auto" onclick="location.href='tienda.html'">TIENDA</button>
</div>

<div class="wrap">

<div class="card">
<div class="head">TIERRA ROSA - INICIAR SESIÓN</div>

<input class="inp" placeholder="Usuario">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn btnNegro" onclick="go()">Login</button>

<input class="inp" placeholder="Teléfono" style="margin-top:10px">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="go()">Login</button>

<input class="inp" placeholder="1er Correo Electrónico" style="margin-top:10px">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="go()">Login</button>

<input class="inp" placeholder="2do Correo Electrónico" style="margin-top:10px">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="go()">Login</button>

<input class="inp" placeholder="Microsoft" style="margin-top:10px">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="go()">Login</button>

<input class="inp" placeholder="Drive" style="margin-top:10px">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="go()">Login</button>

<input class="inp" placeholder="Netacad" style="margin-top:10px">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="go()">Login</button>

<input class="inp" placeholder="Outlook" style="margin-top:10px">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="go()">Login</button>

<input class="inp" placeholder="Eduardo" style="margin-top:10px">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="go()">Login</button>
</div>

<div class="card">
<div class="head">Enlaces</div>
<div class="grid2">
<button class="btn" onclick="msg('Necesitas Ayuda')">Necesitas Ayuda</button>
<button class="btn" onclick="msg('Noticias')">Noticias</button>
<button class="btn" onclick="msg('Eventos')">Eventos</button>
<button class="btn" onclick="msg('Sociedad')">Sociedad</button>
<button class="btn" onclick="msg('Actualizaciones')">Actualizaciones</button>
<button class="btn" onclick="msg('Fundadores')">Fundadores</button>
<button class="btn" onclick="go()">Registrarme</button>
<button class="btn" onclick="go()">Un Click</button>
</div>
<div class="sep">O</div>
<button class="btn btnNegro" onclick="go()">UN CLICK 👌</button>
</div>

<div class="card">
<div class="head">Botones chiquitos funcionando</div>
<div class="chips" id="chipBox"></div>
</div>

<div style="text-align:center;font-size:7px;font-weight:900;padding:8px">
TIERRA ROSA - Beige Claro arena cálido / crema tostado<br>Texto y bordes negro - Botones blancos - icon-19.jpg
</div>

</div>

<script>
const lista="Google,GitHub,Vercel,Netlify,Render,Claro,Word,Files,Copa Fácil,Spotify,Facebook,Steam,Bluesky,XBOX,Apple TV,LinkedIn,Tik Tok,Canva,Pinterest,Threads,Duolingo,Termux,YouTube,EA,Acode,Twitch,Instagram,Snapchat,Telegram,Titanes,Speaking,FreeFire,Amazon,FCMobile,Discord,Vix,Vivo".split(",");
const box=document.getElementById('chipBox');
lista.forEach(n=>{
let b=document.createElement('button');b.className='chip';b.textContent=n;
b.onclick=()=>{alert(n+" ✅\nBotón funcionando\nTIERRA ROSA"); if(n==='Acode') location.href='tienda.html'};
box.appendChild(b);
});
function go(){location.href='tienda.html'}
function msg(t){alert(t+"\nTIERRA ROSA x TITANES x SPEAKING\nHecho en México 2026")}
</script>
</body>
</html>
