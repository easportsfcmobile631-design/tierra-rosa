<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TierraRosa</title>
<link rel="icon" href="./icon-19.jpg">
<link rel="apple-touch-icon" href="./icon-19.jpg">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F5E8D0">
<style>
:root{--beige:#F5E8D0;--crema:#FFF8EC;--blanco:#fff;--negro:#000}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black,Arial,sans-serif}
body{background:var(--beige);color:var(--negro)}
.top{background:var(--crema);border-bottom:3px solid #000;display:flex;align-items:center;gap:10px;padding:12px;position:sticky;top:0;z-index:10}
.cir{width:44px;height:44px;border:3px solid #000;border-radius:50%;overflow:hidden;background:#fff}
.cir img{width:100%;height:100%;object-fit:cover;display:block}
.brand{font-weight:900;font-size:17px}
.wrap{max-width:500px;margin:auto;padding:12px;padding-bottom:90px}
.card{background:var(--crema);border:3px solid #000;border-radius:14px;padding:12px;margin-bottom:12px}
.tit{border:3px solid #000;background:var(--blanco);border-radius:10px;text-align:center;padding:9px;font-size:12px;font-weight:900;margin-bottom:10px}
.inp{width:100%;border:2.5px solid #000;background:var(--blanco);border-radius:10px;padding:12px;margin:5px 0;font-size:11px;font-weight:700;outline:none}
.btn{width:100%;border:3px solid #000;background:var(--blanco);border-radius:10px;padding:12px;margin-top:6px;font-weight:900;cursor:pointer}
.btnN{background:#000;color:#fff}
.enlace{width:100%;border:0;border-bottom:2.5px solid #000;background:transparent;padding:14px 4px;font-weight:900;font-size:12px;display:flex;justify-content:space-between;text-align:left;cursor:pointer}
.enlace:active{background:var(--blanco)}
.bigGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigBtn{border:3px solid #000;background:var(--blanco);border-radius:10px;padding:14px 6px;font-size:10px;font-weight:900;cursor:pointer}
.bigBtn:active{background:#000;color:#fff}
#installBtn{position:fixed;right:14px;bottom:14px;border:3px solid #000;background:#000;color:#fff;border-radius:25px;padding:13px 22px;font-weight:900;font-size:11px;z-index:99;cursor:pointer}
</style>
</head>
<body>
<div class="top">
<div class="cir"><img src="./icon-19.jpg" alt="logo"></div>
<div class="brand">TierraRosa</div>
</div>

<div class="wrap">
<div class="card">
<div class="tit">🔑 INICIAR SESIÓN</div>
<input class="inp" maxlength="75" placeholder="Usuario - 75 caracteres">
<input class="inp" maxlength="75" type="password" placeholder="Contraseña - 75 caracteres">
<button class="btn btnN" onclick="location.href='./tienda.html'">Login</button>
</div>

<div class="card">
<div class="tit">Enlaces</div>
<button class="enlace" onclick="location.href='./necesitas-ayuda.html'">Necesitas Ayuda <span>></span></button>
<button class="enlace" onclick="location.href='./fundadores.html'">Fundadores <span>></span></button>
<button class="enlace" onclick="location.href='./registrarme.html'">Registrarme <span>></span></button>
<button class="enlace" onclick="location.href='./tienda.html'">Un Click <span>></span></button>
<div style="text-align:center;font-weight:900;margin:12px 0">O</div>
<button class="btn btnN" onclick="location.href='./tienda.html'">[Un click] botón</button>
</div>

<div class="card">
<div class="tit">Consulta mis Redes Sociales</div>
<div class="bigGrid" id="grid"></div>
</div>
</div>

<button id="installBtn">INSTALAR 📲</button>

else{alert('TierraRosa 🌸\nPara instalar en GitHub:\nChrome > ⋮ > Instalar app')}});

</body>
</html>
