<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIERRA ROSA</title>
<link rel="icon" href="icon-19.jpg">
<link rel="apple-touch-icon" href="icon-19.jpg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5E8D0">
<style>
:root{--beige:#F5E8D0;--arena:#EADFC7;--crema:#FFF8EC;--negro:#000}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black, Arial, sans-serif}
body{background:var(--beige);color:#000}
.top{position:sticky;top:0;z-index:10;background:var(--crema);border-bottom:3px solid #000;display:flex;align-items:center;gap:8px;padding:8px 10px}
.cir{width:44px;height:44px;border-radius:50%;border:3px solid #000;overflow:hidden;background:#fff;flex-shrink:0}
.cir img{width:100%;height:100%;object-fit:cover}
.brand{font-weight:900;font-size:14px;line-height:1;letter-spacing:1px}
.wrap{max-width:480px;margin:auto;padding:10px}
.card{background:var(--crema);border:3px solid #000;border-radius:12px;padding:10px;margin-bottom:10px}
.titulo{font-size:13px;font-weight:900;text-align:center;border:2px solid #000;background:#fff;border-radius:8px;padding:6px;margin-bottom:8px}
.inp{width:100%;padding:9px;border:2.5px solid #000;border-radius:8px;background:#fff;font-size:11px;font-weight:700;margin:4px 0;outline:none}
.btn{width:100%;padding:9px;background:#fff;border:2.5px solid #000;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer;margin-top:5px}
.btn:active{background:#000;color:#fff}
.btnNegro{background:#000;color:#fff;border:2.5px solid #000}
.row{display:flex;gap:6px}
.row .btn,.row .inp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{border:2px solid #000;background:#fff;border-radius:20px;padding:4px 8px;font-size:8px;font-weight:900;cursor:pointer}
.chip:active{background:#000;color:#fff}
.sep{text-align:center;font-weight:900;font-size:10px;margin:8px 0}
.linkGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.smallBtn{border:2px solid #000;background:#fff;border-radius:6px;padding:6px;font-size:7.5px;font-weight:900;cursor:pointer;text-align:center}
</style>
</head>
<body>
<div class="top">
<div class="cir"><img src="icon-19.jpg" onerror="this.style.display='none'"></div>
<div class="brand">TIERRA ROSA<br><span style="font-size:8px">x TITANES x SPEAKING</span></div>
<div style="margin-left:auto;border:2px solid #000;background:#fff;border-radius:6px;padding:3px 6px;font-size:8px;font-weight:900;cursor:pointer" onclick="location.href='tienda.html'">TIENDA</div>
</div>

<div class="wrap">
<!-- INICIAR SESIÓN -->
<div class="card">
<div class="titulo">TIERRA ROSA - INICIAR SESIÓN</div>
<input class="inp" id="usuario" placeholder="Usuario">
<input class="inp" id="pass1" type="password" placeholder="Contraseña">
<button class="btn btnNegro" onclick="login('Usuario')">Login</button>

<div class="sep">—</div>
<input class="inp" placeholder="Teléfono">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="login('Teléfono')">Login</button>

<div class="sep">—</div>
<input class="inp" placeholder="1er Correo Electrónico">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="login('1er Correo')">Login</button>

<div class="sep">—</div>
<input class="inp" placeholder="2do Correo Electrónico">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="login('2do Correo')">Login</button>

<div class="sep">—</div>
<input class="inp" placeholder="Microsoft">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="login('Microsoft')">Login</button>

<input class="inp" placeholder="Drive" style="margin-top:10px">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="login('Drive')">Login</button>

<input class="inp" placeholder="Netacad" style="margin-top:10px">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="login('Netacad')">Login</button>

<input class="inp" placeholder="Outlook" style="margin-top:10px">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="login('Outlook')">Login</button>

<input class="inp" placeholder="Eduardo" style="margin-top:10px">
<input class="inp" type="password" placeholder="Contraseña">
<button class="btn" onclick="login('Eduardo')">Login</button>
</div>

<div class="card">
<div class="titulo">Enlaces</div>
<div class="linkGrid">
<button class="smallBtn" onclick="openInfo('Necesitas Ayuda')">Necesitas Ayuda</button>
<button class="smallBtn" onclick="openInfo('Noticias')">Noticias</button>
<button class="smallBtn" onclick="openInfo('Eventos')">Eventos</button>
<button class="smallBtn" onclick="openInfo('Sociedad')">Sociedad</button>
<button class="smallBtn" onclick="openInfo('Actualizaciones')">Actualizaciones</button>
<button class="smallBtn" onclick="openInfo('Fundadores')">Fundadores</button>
<button class="smallBtn" onclick="location.href='tienda.html'">Registrarme</button>
<button class="smallBtn" onclick="location.href='tienda.html'">Un Click</button>
</div>
<div class="sep">O</div>
<button class="btn btnNegro" onclick="location.href='tienda.html'">UN CLICK 👌</button>
</div>

<div class="card">
<div class="titulo">Botones chiquitos - Funcionando</div>
<div class="chips" id="chips"></div>
</div>

<div style="text-align:center;font-size:7px;font-weight:900;padding:10px;line-height:1.4">
TIERRA ROSA<br>Asociación TIERRA ROSA x TITANES x SPEAKING<br>Hecho en México 2026<br>icon-19.jpg<br>Beige Claro tono arena cálido / crema tostado<br>Bordes y Texto Negro - Botones Blancos
</div>
</div>

<div id="modal" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:10px" onclick="this.style.display='none'">
<div style="background:#FFF8EC;border:3px solid #000;border-radius:12px;padding:14px;width:100%;max-width:360px" onclick="event.stopPropagation()">
<b id="mTitle" style="font-size:12px"></b><div id="mText" style="font-size:10px;margin-top:8px"></div>
<button class="btn" style="margin-top:10px" onclick="document.getElementById('modal').style.display='none'">Cerrar</button>
</div>
</div>

<script>
const apps=["Google","GitHub","Vercel","Netlify","Render","Claro","Word","Files","Copa Fácil","Spotify","Facebook","Steam","Bluesky","XBOX","Apple TV","LinkedIn","Tik Tok","Canva","Pinterest","Threads","Duolingo","Termux","YouTube","EA","Acode","Twitch","Instagram","Snapchat","Telegram","Titanes","Speaking","FreeFire","Amazon","FCMobile","Discord","Vix","Vivo"];
const box=document.getElementById('chips');
apps.forEach(n=>{
let b=document.createElement('button');b.className='chip';b.textContent=n;
b.onclick=()=>{document.getElementById('mTitle').innerText=n;document.getElementById('mText').innerText=n+' - Botón funcionando ✅\nConectado a TIERRA ROSA';document.getElementById('modal').style.display='flex'};
box.appendChild(b);
});
function login(tipo){
let u=document.getElementById('usuario').value||'Usuario';
localStorage.setItem('ultimo_login',tipo);
alert(tipo+' - Login OK ✅\nBienvenido a TIERRA ROSA');
location.href='tienda.html';
}
function openInfo(t){
document.getElementById('mTitle').innerText=t;
document.getElementById('mText').innerText=t+' - Información de TIERRA ROSA x TITANES x SPEAKING - Hecho en México 2026';
document.getElementById('modal').style.display='flex';
}
</script>
</body>
 </html>
